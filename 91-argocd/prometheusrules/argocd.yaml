# Vendored from the community ArgoCD Prometheus mixin
# (github.com/adinhodovic/argo-cd-mixin), fetched 2026-09-07 from
# https://raw.githubusercontent.com/adinhodovic/argo-cd-mixin/main/prometheus_alerts.yaml
# — found via monitoring.mixins.dev (checked first, per user request) which
# lists this as the ArgoCD entry. Community-maintained (not published by
# argoproj/argo-cd itself), same category as this repo's other vendored
# rule sets (Longhorn, Traefik, ingress-nginx, cert-manager, OpenBao).
#
# The source's `job=~"(argocd|argo-cd).*"` regex filter is kept as-is —
# it matches this repo's Helm release name ("argocd", see Install.ps1) and
# the chart-native ServiceMonitors' derived job labels (argocd-server,
# argocd-repo-server, argocd-application-controller, all "argocd"-prefixed)
# without needing to pin an exact job name. Not independently re-verified
# against a live scrape.
#
# Dropped every alert's `dashboard_url` annotation (points at
# grafana.com/d/argo-cd-*-kask, a public Grafana Cloud dashboard UID that
# doesn't exist in this install) — same choice already made for the
# Traefik/ingress-nginx/Longhorn/cert-manager vendored rules.
#
# `release: prometheus` is required — this repo's kube-prometheus-stack
# leaves ruleSelectorNilUsesHelmValues at its chart default (true), so an
# unlabeled PrometheusRule is silently never picked up, same as an
# unlabeled ServiceMonitor. Applied namespace-less (no metadata.namespace)
# — the caller supplies -n via Register-PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: argo-cd
    rules:
    - alert: ArgoCdAppSyncFailed
      expr: |
        sum(
          round(
            increase(
              argocd_app_sync_total{
                job=~"(argocd|argo-cd).*",
                phase!="Succeeded"
              }[10m]
            )
          )
        ) by (cluster, job, dest_server, project, name, phase) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD application sync failed.
        description: >-
          Application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }}
          had at least one sync attempt fail with phase {{ $labels.phase }} in the last 10m.
    - alert: ArgoCdAppUnhealthy
      expr: |
        sum(
          argocd_app_info{
            job=~"(argocd|argo-cd).*",
            health_status!~"Healthy|Progressing",
            name!~""
          }
        ) by (cluster, job, dest_server, project, name, health_status) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD application is unhealthy.
        description: >-
          Application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }}
          has reported health status {{ $labels.health_status }} for at least 15m.
    - alert: ArgoCdAppOutOfSync
      expr: |
        sum(
          argocd_app_info{
            job=~"(argocd|argo-cd).*",
            sync_status!="Synced"
          }
        ) by (cluster, job, dest_server, project, name, sync_status) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD application is out of sync.
        description: >-
          Application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }}
          has reported sync status {{ $labels.sync_status }} for at least 15m.
    - alert: ArgoCdAppAutoSyncDisabled
      expr: |
        sum(
          argocd_app_info{
            job=~"(argocd|argo-cd).*",
            autosync_enabled!="true",
            name!~""
          }
        ) by (cluster, job, dest_server, project, name, autosync_enabled) > 0
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: ArgoCD application auto-sync is disabled.
        description: >-
          Application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }}
          has had auto-sync disabled for at least 2h.
    - alert: ArgoCdRolloutProgressing
      expr: |
        sum(
          argocd_app_info{
            job=~"(argocd|argo-cd).*",
            health_status="Progressing",
            name!~""
          }
        ) by (cluster, job, dest_server, project, name, health_status) > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: ArgoCD application rollout is still progressing.
        description: >-
          Application {{ $labels.dest_server }}/{{ $labels.project }}/{{ $labels.name }}
          has remained in health status Progressing for more than 1h.
    - alert: ArgoCdNotificationDeliveryFailed
      expr: |
        sum(
          round(
            increase(
              argocd_notifications_deliveries_total{
                job=~"(argocd|argo-cd).*",
                succeeded!="true"
              }[10m]
            )
          )
        ) by (cluster, job, exported_service, succeeded) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD notification delivery failed.
        description: >-
          Notification job {{ $labels.job }} failed to deliver to
          {{ $labels.exported_service }} at least once in the last 10m.
    - alert: ArgoCdAppControllerHighReconciliationDuration
      expr: |
        histogram_quantile(0.95,
          sum(
            rate(
              argocd_app_reconcile_bucket{
                job=~"(argocd|argo-cd).*"
              }[2m]
            )
          ) by (cluster, namespace, le)
        ) > 60
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD application reconciliation is slow.
        description: >-
          The P0.95 application reconciliation duration in namespace {{ $labels.namespace }}
          has been above 60s for 10m. The application controller may be overloaded or blocked
          on Kubernetes API calls.
    - alert: ArgoCdRepoServerPendingRequests
      expr: |
        sum(
          argocd_repo_pending_request_total{
            job=~"(argocd|argo-cd).*"
          }
        ) by (cluster, namespace) > 50
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD repo server has pending requests.
        description: >-
          Repo server in namespace {{ $labels.namespace }} has had more than 50 pending
          requests for 10m. The repo server may be overloaded or waiting on slow repository
          operations.
    - alert: ArgoCdRepoServerHighGitRequestDuration
      expr: |
        histogram_quantile(0.95,
          sum(
            rate(
              argocd_git_request_duration_seconds_bucket{
                job=~"(argocd|argo-cd).*"
              }[2m]
            )
          ) by (cluster, namespace, le)
        ) > 30
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD repo server Git requests are slow.
        description: >-
          The P0.95 Git request duration in namespace {{ $labels.namespace }} has been
          above 30s for 10m. Repository access, network latency, or repo server load may
          be degraded.
    - alert: ArgoCdClusterConnectionError
      expr: |
        argocd_cluster_connection_status{
          job=~"(argocd|argo-cd).*"
        } < 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD cannot connect to a managed cluster.
        description: >-
          ArgoCD in namespace {{ $labels.namespace }} has been unable to connect to
          cluster {{ $labels.server }} for 5m. Check cluster credentials, API server
          reachability, and network policy.
    - alert: ArgoCdGitRequestErrors
      expr: |
        sum(
          round(
            increase(
              argocd_git_fetch_fail_total{
                job=~"(argocd|argo-cd).*"
              }[2m]
            )
          )
        ) by (cluster, namespace, repo) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD Git requests are failing.
        description: >-
          ArgoCD in namespace {{ $labels.namespace }} has had Git fetch failures for
          repository {{ $labels.repo }} for 5m. Check repository availability,
          credentials, and network connectivity.
    - alert: ArgoCdHighKubectlRateLimiterDuration
      expr: |
        histogram_quantile(0.95,
          sum(
            rate(
              argocd_kubectl_rate_limiter_duration_seconds_bucket{
                job=~"(argocd|argo-cd).*"
              }[2m]
            )
          ) by (cluster, namespace, le)
        ) > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD kubectl client-side throttling is high.
        description: >-
          The P0.95 kubectl rate limiter wait time in namespace {{ $labels.namespace }}
          has been above 1s for 10m. ArgoCD may be throttling requests before they reach
          the Kubernetes API server.
    - alert: ArgoCdHighKubectlRequestDuration
      expr: |
        histogram_quantile(0.95,
          sum(
            rate(
              argocd_kubectl_request_duration_seconds_bucket{
                job=~"(argocd|argo-cd).*"
              }[2m]
            )
          ) by (cluster, namespace, le)
        ) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD kubectl requests are slow.
        description: >-
          The P0.95 kubectl request duration in namespace {{ $labels.namespace }} has
          been above 5s for 10m. The Kubernetes API server or network path may be slow.
    - alert: ArgoCdHighKubectlRequestRetryRate
      expr: |
        sum(
          increase(
            argocd_kubectl_request_retries_total{
              job=~"(argocd|argo-cd).*"
            }[1m]
          )
        ) by (cluster, namespace) > 50
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD kubectl request retry rate is high.
        description: >-
          ArgoCD in namespace {{ $labels.namespace }} has had more than 50 kubectl
          request retries per minute for 10m. This usually points to Kubernetes API
          errors, throttling, or network instability.
    - alert: ArgoCdHighGrpcErrorRate
      expr: |
        sum(
          rate(
            grpc_server_handled_total{
              job=~"(argocd|argo-cd).*",
              grpc_code!="OK"
            }[2m]
          )
        ) by (cluster, namespace, job)
        /
        sum(
          rate(
            grpc_server_handled_total{
              job=~"(argocd|argo-cd).*"
            }[2m]
          )
        ) by (cluster, namespace, job) * 100 > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD gRPC error rate is high.
        description: >-
          ArgoCD job {{ $labels.job }} in namespace {{ $labels.namespace }} has had a
          gRPC error rate above 5% for 10m. Check argocd-server errors and upstream
          dependencies.
    - alert: ArgoCdHighKubectlPendingExec
      expr: |
        sum(
          argocd_kubectl_exec_pending{
            job=~"(argocd|argo-cd).*"
          }
        ) by (cluster, namespace) > 10
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: ArgoCD has many pending kubectl executions.
        description: >-
          ArgoCD in namespace {{ $labels.namespace }} has had more than 10 pending
          kubectl executions for 15m. This may indicate resource contention, slow
          Kubernetes API calls, or slow manifest generation.
