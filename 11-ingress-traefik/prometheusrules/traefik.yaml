# Vendored from the official Traefik Grafana mixin (grafana/jsonnet-libs,
# traefik-mixin/prometheus_rules_out/prometheus_alerts.yaml), fetched
# 2026-09-05 from https://raw.githubusercontent.com/grafana/jsonnet-libs/master/traefik-mixin/prometheus_rules_out/prometheus_alerts.yaml
# — same source that pairs with the traefik.json dashboard already
# registered by Install.ps1. Community-maintained (not published by Traefik
# Labs itself), same category as this repo's other vendored dashboard IDs.
#
# `release: prometheus` is required — this repo's kube-prometheus-stack
# leaves ruleSelectorNilUsesHelmValues at its chart default (true), so an
# unlabeled PrometheusRule is silently never picked up, same as an unlabeled
# ServiceMonitor. Applied namespace-less (no metadata.namespace) — the
# caller supplies -n via Register-PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traefik-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: traefik
    rules:
    - alert: TraefikConfigReloadFailuresIncreasing
      expr: sum by (job) (rate(traefik_config_reloads_failure_total{}[5m])) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Traefik is failing to reload its configuration.
        description: Traefik is failing to reload its config in {{ $labels.job }}.
    - alert: TraefikTLSCertificatesExpiring
      expr: max by (instance, sans) ((last_over_time(traefik_tls_certs_not_after{}[5m]) - time()) / 86400) < 7
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: A Traefik-served TLS certificate will expire very soon.
        description: >-
          The minimum number of days until a Traefik-served certificate
          expires is {{ printf "%.0f" $value }} days on {{ $labels.sans }}
          which is below the critical threshold of 7.
    - alert: TraefikTLSCertificatesExpiringSoon
      expr: max by (instance, sans) ((last_over_time(traefik_tls_certs_not_after{}[5m]) - time()) / 86400) < 14 > 7
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A Traefik-served TLS certificate will expire soon.
        description: >-
          The minimum number of days until a Traefik-served certificate
          expires is {{ printf "%.0f" $value }} days on {{ $labels.sans }}
          which is less than 14 but greater than 7.
