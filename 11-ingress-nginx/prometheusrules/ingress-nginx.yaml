# Vendored verbatim from the community ingress-nginx-mixin
# (github.com/adinhodovic/ingress-nginx-mixin, prometheus_alerts.yaml),
# fetched 2026-09-05 from https://raw.githubusercontent.com/adinhodovic/ingress-nginx-mixin/main/prometheus_alerts.yaml
# — cataloged at https://monitoring.mixins.dev/ingress-nginx-mixin/, the
# same central registry the ingress-nginx.json dashboard's grafana.com ID
# was cross-checked against. Community-maintained (not published by the
# kubernetes/ingress-nginx project itself), same category as this repo's
# other vendored dashboard IDs.
#
# `job=~"ingress-nginx-controller-metrics"` matches this chart's dedicated
# metrics Service name (see Install.ps1's Resolve-ServiceRealPorts call —
# Prometheus Operator defaults a ServiceMonitor's `job` label to the target
# Service's name), so no rewrite was needed against our own deployment.
#
# `release: prometheus` is required — this repo's kube-prometheus-stack
# leaves ruleSelectorNilUsesHelmValues at its chart default (true), so an
# unlabeled PrometheusRule is silently never picked up, same as an unlabeled
# ServiceMonitor. Applied namespace-less (no metadata.namespace) — the
# caller supplies -n via Register-PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ingress-nginx-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: nginx.rules
    rules:
    - alert: NginxConfigReloadFailed
      expr: |
        sum(
          nginx_ingress_controller_config_last_reload_successful{job=~"ingress-nginx-controller-metrics"}
        ) by (cluster, job, controller_class)
        == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Nginx config reload failed."
        description: "Nginx config reload failed for the controller with the class {{ $labels.controller_class }}."
        dashboard_url: "https://grafana.com/d/ingress-nginx-overview-12mk/ingress-nginx-overview?var-job={{ $labels.job }}&var-controller_class={{ $labels.controller_class }}"
    - alert: NginxHighHttp4xxErrorRate
      expr: |
        (
          sum(
            rate(
              nginx_ingress_controller_requests{
                job=~"ingress-nginx-controller-metrics",
                status=~"^4.*",
                ingress!~""
              }[5m]
            )
          ) by (cluster, exported_namespace, ingress)
          /
          sum(
            rate(
              nginx_ingress_controller_requests{
                job=~"ingress-nginx-controller-metrics",
                ingress!~""
              }[5m]
            )
          ) by (cluster, exported_namespace, ingress)
          * 100
        ) > 5
      for: 1m
      labels:
        severity: info
      annotations:
        summary: "Nginx high HTTP 4xx error rate."
        description: "More than 5% HTTP requests with status 4xx for {{ $labels.exported_namespace }}/{{ $labels.ingress }} the past 5m."
        dashboard_url: "https://grafana.com/d/ingress-nginx-overview-12mk/ingress-nginx-overview?var-exported_namespace={{ $labels.exported_namespace }}&var-ingress={{ $labels.ingress }}"
    - alert: NginxHighHttp5xxErrorRate
      expr: |
        (
          sum(
            rate(
              nginx_ingress_controller_requests{
                job=~"ingress-nginx-controller-metrics",
                status=~"^5.*",
                ingress!~""
              }[5m]
            )
          ) by (cluster, exported_namespace, ingress)
          /
          sum(
            rate(
              nginx_ingress_controller_requests{
                job=~"ingress-nginx-controller-metrics",
                ingress!~""
              }[5m]
            )
          ) by (cluster, exported_namespace, ingress)
          * 100
        ) > 5
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Nginx high HTTP 5xx error rate."
        description: "More than 5% HTTP requests with status 5xx for {{ $labels.exported_namespace }}/{{ $labels.ingress }} the past 5m."
        dashboard_url: "https://grafana.com/d/ingress-nginx-overview-12mk/ingress-nginx-overview?var-exported_namespace={{ $labels.exported_namespace }}&var-ingress={{ $labels.ingress }}"
