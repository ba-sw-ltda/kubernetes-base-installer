# Vendored from the community cert-manager Prometheus mixin
# (github.com/imusmanmalik/cert-manager-mixin), fetched 2026-09-06 from
# https://raw.githubusercontent.com/imusmanmalik/cert-manager-mixin/main/alerts/absent.libsonnet
# and .../alerts/certificates.libsonnet — found via monitoring.mixins.dev
# (checked first, per user request) which lists this as the cert-manager
# entry. Community-maintained (not published by cert-manager/Jetstack
# itself), same category as this repo's other vendored rule sets.
#
# The source is jsonnet with config-driven templating; resolved here to
# concrete PromQL using the mixin's own documented defaults
# (config.libsonnet): enableMultiCluster=false (drops the multi-cluster
# label selector), certManagerReplaceExportedNamespace=false (uses the
# simpler non-label_replace expr branch), certManagerCertExpiryRenewalElapsedThreshold=0.3
# (renewal-window-remaining multiplier baked in as 0.7). Dropped the
# mixin's optional dashboard_url/runbook_url annotations (grafanaExternalUrl
# defaults to a placeholder we don't have a real value for) — same choice
# already made for the Traefik/ingress-nginx/Longhorn vendored rules.
#
# certManagerJobLabel defaults to 'cert-manager' upstream; this repo's
# cert-manager Helm release is also named "cert-manager" (see Install.ps1),
# so the chart-native ServiceMonitor's target job label matches — not
# independently re-verified against a live scrape, so double check
# `up{job="cert-manager"}` resolves once this is live.
#
# `release: prometheus` is required — this repo's kube-prometheus-stack
# leaves ruleSelectorNilUsesHelmValues at its chart default (true), so an
# unlabeled PrometheusRule is silently never picked up, same as an
# unlabeled ServiceMonitor. Applied namespace-less (no metadata.namespace)
# — the caller supplies -n via Register-PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: cert-manager
    rules:
    - alert: CertManagerAbsent
      expr: absent(up{job="cert-manager"})
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Cert Manager has disappeared from Prometheus service discovery.
        description: >-
          New certificates will not be able to be minted, and existing ones
          can't be renewed until cert-manager is back.
  - name: certificates
    rules:
    - alert: CertManagerCertExpirySoon
      expr: >-
        avg by (exported_namespace, namespace, name) (
          (certmanager_certificate_expiration_timestamp_seconds - time())
          and on (exported_namespace, namespace, name)
          (certmanager_certificate_ready_status{condition="True"} == 1)
        )
        <
        avg by (exported_namespace, namespace, name) (
          certmanager_certificate_expiration_timestamp_seconds - certmanager_certificate_renewal_timestamp_seconds
        ) * 0.7
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: The cert `{{ $labels.name }}` is {{ $value | humanizeDuration }} from expiry, it should have been renewed by now.
        description: >-
          The domain that this cert covers will be unavailable after
          {{ $value | humanizeDuration }}. Clients using endpoints that this
          cert protects will start to fail in {{ $value | humanizeDuration }}.
    - alert: CertManagerCertNotReady
      expr: >-
        max by (name, exported_namespace, namespace, condition) (
          certmanager_certificate_ready_status{condition!="True"} == 1
        )
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: The cert `{{ $labels.name }}` is not ready to serve traffic.
        description: >-
          This certificate has not been ready to serve traffic for at least
          10m. If the cert is being renewed or there is another valid cert,
          the ingress controller _may_ be able to serve that instead.
    - alert: CertManagerHittingRateLimits
      expr: >-
        sum by (host) (
          rate(certmanager_http_acme_client_request_count{status="429"}[5m])
        ) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Cert manager hitting LetsEncrypt rate limits.
        description: >-
          Depending on the rate limit, cert-manager may be unable to
          generate certificates for up to a week.
