# Vendored Prometheus alerting rules for OpenBao (Vault-compatible metric
# namespace — OpenBao is a fork of HashiCorp Vault and keeps the same
# `vault_*` metric names). Reverses the "nothing usable" verdict recorded
# here on 2026-09-06 (this file's own history / commit that added the old
# comment) — that pass missed two real sources, both cross-checked against
# each other below and found to agree.
#
# Sources (fetched 2026-09-06, both raw GitHub, not the rendered doc sites):
#   - cloudducoeur/collection-prometheus-alerting-rules
#     https://raw.githubusercontent.com/cloudducoeur/collection-prometheus-alerting-rules/main/src/openbao-exporter/README.md
#   - samber/awesome-prometheus-alerts, "Hashicorp Vault" category
#     https://raw.githubusercontent.com/samber/awesome-prometheus-alerts/master/dist/rules/hashicorp-vault/embedded-exporter.yml
# Both list the exact same 4 alerts under the exact same names, with
# matching (in one case slightly refined) expressions — independent
# corroboration, not just one source's guess. samber's version of
# VaultClusterHealth adds an `and count(vault_core_active) > 0` guard
# (avoids a 0/0 division producing a false-positive NaN comparison when no
# `vault_core_active` series exists yet, e.g. right after install before
# the ServiceMonitor's first scrape) — used here since it's strictly safer;
# the two sets are otherwise identical.
#
# All 4 alerts use raw `vault_*` metric names, not `up{job="..."}"` — no
# job-label match caveat like this repo's cert-manager/traefik rules have.
# None of these 4 are Raft/HA-specific — VaultClusterHealth's
# sum(vault_core_active)/count(vault_core_active) is a no-op under
# standalone (always evaluates to exactly 1, a single node is always its
# own "active" member) and only starts actually testing anything once the
# 2026-09-06 HA commit is deployed with 3 replicas.
#
# The 3 alerts below (VaultAutopilotUnhealthy, VaultRaftNodeUnhealthy,
# VaultRaftPeerCountLow) were added with that same 2026-09-06 HA commit.
# Metric names + types verified verbatim against OpenBao's own docs (not
# samber/cloudducoeur, which predate HA support in this repo and don't
# cover it): https://openbao.org/docs/internals/telemetry/metrics/raft/
#   vault_autopilot_healthy      (gauge) "Indicates whether all nodes are healthy"
#   vault_autopilot_node_healthy (gauge) "Indicates whether the active node is healthy"
#   vault_raft_peers             (gauge) "The number of peers in the raft cluster configuration"
# All three are Raft-only metrics — they simply don't exist as time series
# under standalone mode (storage "file", no raft stanza), so these 3 alerts
# stay silently dormant there rather than misfiring; only live once HA is
# enabled. The "< 3" peer-count threshold is hardcoded rather than templated
# because 33-openbao/Install.ps1 also hardcodes $HAReplicas=3 (no per-count
# prompt exists) — revisit both together if that ever becomes configurable.
#
# `release: prometheus` required — this repo's kube-prometheus-stack leaves
# ruleSelectorNilUsesHelmValues at its chart default (true). Applied
# namespace-less (no metadata.namespace) — the caller supplies -n via
# Register-PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: openbao
    rules:
    - alert: VaultSealed
      expr: vault_core_unsealed == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Vault sealed (instance {{ $labels.instance }})"
        description: >-
          Vault instance is sealed on {{ $labels.instance }}.
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
    - alert: VaultTooManyPendingTokens
      expr: avg(vault_token_create_count - vault_token_store_count) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Vault too many pending tokens (instance {{ $labels.instance }})"
        description: >-
          Too many pending tokens on {{ $labels.instance }}: {{ $value }}
          tokens created but not yet stored.
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
    - alert: VaultTooManyInfinityTokens
      expr: vault_token_count_by_ttl{creation_ttl="+Inf"} > 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Vault too many infinity tokens (instance {{ $labels.instance }})"
        description: >-
          Too many non-expiring tokens on {{ $labels.instance }}:
          {{ $value }} tokens with infinite TTL.
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
    - alert: VaultClusterHealth
      expr: >-
        sum(vault_core_active) / count(vault_core_active) <= 0.5
        and count(vault_core_active) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Vault cluster health (instance {{ $labels.instance }})"
        description: >-
          Vault cluster is not healthy: only
          {{ $value | humanizePercentage }} of nodes are active.
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
    - alert: VaultAutopilotUnhealthy
      expr: vault_autopilot_healthy == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Vault Raft cluster unhealthy per autopilot (instance {{ $labels.instance }})"
        description: >-
          Raft autopilot reports not all nodes are healthy on
          {{ $labels.instance }}. Only present under HA (storage "raft");
          check `bao operator raft list-peers` / pod logs for the affected
          replica.
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
    - alert: VaultRaftNodeUnhealthy
      expr: vault_autopilot_node_healthy == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Vault Raft active node unhealthy (instance {{ $labels.instance }})"
        description: >-
          Raft autopilot reports the active node is unhealthy on
          {{ $labels.instance }}. Only present under HA (storage "raft").
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
    - alert: VaultRaftPeerCountLow
      expr: vault_raft_peers < 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Vault Raft cluster has too few peers (instance {{ $labels.instance }})"
        description: >-
          Raft cluster configuration on {{ $labels.instance }} reports only
          {{ $value }} peers, below the expected 3-replica HA quorum. A node
          may be down or has failed to (re)join the cluster.
          VALUE = {{ $value }}
          LABELS = {{ $labels }}
